# =============================================================================
# base_config.yaml -- the controlled reference for every ablation cell.
#
# Every file in configs/experiments/ inherits from this one via `_base_:` and
# changes ONLY the axis it is testing (backbone / normalization / augmentation /
# batch shape).  If a number needs to change for all cells, change it here.
# =============================================================================

# --- Provenance --------------------------------------------------------------
project: histo-robust
dataset_source: NCT-CRC-HE-100K-NONORM
dataset_target: CRC-VAL-HE-7K
seed_note: "docs/PLAN.md fixes the split seed at 42; runtime.seed mirrors it."

# --- Reproducibility ---------------------------------------------------------
runtime:
  seed: 42
  deterministic: true

# --- Paths (relative to the repo root; the notebook rewrites these on Kaggle) -
paths:
  data_root: data/raw
  splits_dir: data/processed/splits
  # Optional: directory of pre-normalised tiles written by
  # scripts/preprocess_normalize.py (i.e. data/processed/cache/<method>).  When a
  # COMPLETE cache is present, runs read it instead of normalising online
  # (~5-10x faster); leave null to force the online pipeline.
  normalization_cache: null
  cache_dir: data/processed/cache
  results_dir: results
  checkpoints_dir: checkpoints
  weights_dir: null          # set to the mounted offline-weights dataset if Internet is OFF
  search_roots: []           # extra roots for resolving split CSV image paths

# --- Data --------------------------------------------------------------------
data:
  # Canonical class order from docs/dataset_card.md section 2.  Do not reorder: the
  # label_idx column in the split CSVs is positional.
  class_names: [ADI, BACK, DEB, LYM, MUC, MUS, NORM, STR, TUM]
  num_classes: 9
  image_size: 224            # native patch resolution; no upsampling
  batch_size: 64             # ResNet-50 / ConvNeXt-Tiny (docs/PLAN.md section 5)
  num_workers: 4             # Kaggle gives 4 vCPU; raise only if the loader starves the GPU
  pin_memory: true
  persistent_workers: true
  drop_last: false

# --- Axis B: colour normalization -------------------------------------------
# none | reinhard | macenko
normalization:
  name: none
  # Canonical reference tile.  It must come from the SOURCE training cohort only
  # (never CRC-VAL-HE-7K), otherwise the OOD firewall is broken.
  reference_path: data/processed/templates/reference_stain.png
  params:
    # --- shared ---
    use_tissue_mask: true
    luminance_threshold: 220
    # --- macenko only (see src/histo_robust/normalization/macenko.py) ---
    od_threshold: 0.15
    angular_percentile: 99.0
    concentration_percentile: 99.0
    alpha: 1.0
    background_fraction_limit: 0.85   # docs/PLAN.md Risk 1: skip SVD above 85% glass

# --- Axis C: augmentation policy --------------------------------------------
# none | aug_geo | aug_stain | aug_combined
augmentation:
  policy: none
  resize: null               # optional pre-crop resize (224 native -> leave null)
  geometric:
    hflip_prob: 0.5
    vflip_prob: 0.5
    rot90_prob: 0.5
  stain:
    he_scale: [0.85, 1.15]   # per-stain concentration scaling
    he_shift: [-0.08, 0.08]  # per-stain concentration offset (fraction of C0)
    d_scale: [0.95, 1.05]
    brightness: 0.10
    contrast: 0.10
    hue: 0.03
    saturation: 0.12
    apply_prob: 0.8
    use_dab_channel: true

# --- Axis E: backbone --------------------------------------------------------
# resnet50 | convnext_tiny | phikon
model:
  backbone: resnet50
  pretrained: true
  weights_source: ImageNet-1k
  dropout: 0.1
  freeze_backbone: false     # true -> linear probe on cached features (fast, low VRAM)

# --- Optimisation ------------------------------------------------------------
train:
  epochs: 12
  lr: 0.001                  # AdamW; head/backbone share it unless head_lr_mult is set
  head_lr_mult: 1.0
  weight_decay: 0.05
  betas: [0.9, 0.999]
  label_smoothing: 0.1
  grad_accum_steps: 1
  grad_clip_norm: 1.0
  amp: true
  scheduler: cosine           # cosine | step | none
  warmup_epochs: 1.0
  min_lr_ratio: 0.01
  step_size_epochs: 4
  gamma: 0.3
  early_stopping_patience: 0    # 0 = disabled (cells are usually time-boxed, not plateau-boxed)
  max_train_minutes: 630        # KAGGLE SHORT-SESSION RECIPE: stop at 10.5 h, kill is at 12 h
  oom_retry: true
  oom_batch_floor: 8

# --- Kaggle session controls -------------------------------------------------
session:
  session_minutes: 720        # Kaggle hard kill
  reserve_minutes: 20         # held back for checkpoint flush + zipping outputs
  session_start: null         # e.g. "2025-01-31 12:00:00" (UTC); also read from KAGGLE_SESSION_START

# --- Checkpointing / 20 GB output cap ---------------------------------------
checkpoints:
  save_every_steps: 2000      # --save-every
  keep_last: 3                # --keep-last  (rolling step_*.pt retained)
  keep_best: 3                # best_v*.pt snapshots retained (plus best.pt/last.pt)
  run_quota_gb: 3.0           # per-cell checkpoint quota enforced by auto-pruning

# --- Evaluation --------------------------------------------------------------
evaluation:
  primary_metric: macro_f1
  metrics: [accuracy, balanced_acc, macro_f1, macro_auroc, ece]
  ece_bins: 15
  robustness:
    absolute_drop: "delta = macro_f1_test_id - macro_f1_test_ood"
    retention_rate: "rr = macro_f1_test_ood / macro_f1_test_id * 100"

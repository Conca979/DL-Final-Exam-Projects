# EXP-01 -- Stage 0
# GENERATED by configs/_generate_experiment_configs.py from base_config.yaml.
# Do not hand-edit: change base_config.yaml or CELL_OVERRIDES and regenerate, so
# every cell stays identical outside the axis it is meant to test.
#
# This file is deliberately SELF-CONTAINED (the full merged config is written
# out): it carries no `_base_` key, so what you read here is exactly what runs,
# and two cells can be diffed directly.  `_overrides_` records the delta from
# base_config.yaml for provenance only.  Regenerate after editing the base.
#
# Research question : Primary baseline: in-domain and OOD performance under raw staining.
# Comparator        : anchor
# Backbone          : resnet50
# Normalization     : none
# Augmentation      : none
# ---------------------------------------------------------------------------
project: histo-robust
dataset_source: NCT-CRC-HE-100K-NONORM
dataset_target: CRC-VAL-HE-7K
seed_note: PLAN.md fixes the split seed at 42; runtime.seed mirrors it.
runtime:
  seed: 42
  deterministic: true
paths:
  data_root: data/raw
  splits_dir: data/processed/splits
  normalization_cache: null
  cache_dir: data/processed/cache
  results_dir: results
  checkpoints_dir: checkpoints
  weights_dir: null
  search_roots: []
data:
  class_names:
  - ADI
  - BACK
  - DEB
  - LYM
  - MUC
  - MUS
  - NORM
  - STR
  - TUM
  num_classes: 9
  image_size: 224
  batch_size: 64
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  drop_last: false
normalization:
  name: none
  reference_path: data/processed/templates/reference_stain.png
  params:
    use_tissue_mask: true
    luminance_threshold: 220
    od_threshold: 0.15
    angular_percentile: 99.0
    concentration_percentile: 99.0
    alpha: 1.0
    background_fraction_limit: 0.85
augmentation:
  policy: none
  resize: null
  geometric:
    hflip_prob: 0.5
    vflip_prob: 0.5
    rot90_prob: 0.5
  stain:
    he_scale:
    - 0.85
    - 1.15
    he_shift:
    - -0.08
    - 0.08
    d_scale:
    - 0.95
    - 1.05
    brightness: 0.1
    contrast: 0.1
    hue: 0.03
    saturation: 0.12
    apply_prob: 0.8
    use_dab_channel: true
model:
  backbone: resnet50
  pretrained: true
  weights_source: ImageNet-1k
  dropout: 0.1
  freeze_backbone: false
train:
  epochs: 12
  lr: 0.001
  head_lr_mult: 1.0
  weight_decay: 0.05
  betas:
  - 0.9
  - 0.999
  label_smoothing: 0.1
  grad_accum_steps: 1
  grad_clip_norm: 1.0
  amp: true
  scheduler: cosine
  warmup_epochs: 1.0
  min_lr_ratio: 0.01
  step_size_epochs: 4
  gamma: 0.3
  early_stopping_patience: 0
  max_train_minutes: 630
  oom_retry: true
  oom_batch_floor: 8
session:
  session_minutes: 720
  reserve_minutes: 20
  session_start: null
checkpoints:
  save_every_steps: 2000
  keep_last: 3
  keep_best: 3
  run_quota_gb: 3.0
evaluation:
  primary_metric: macro_f1
  metrics:
  - accuracy
  - balanced_acc
  - macro_f1
  - macro_auroc
  - ece
  ece_bins: 15
  robustness:
    absolute_drop: delta = macro_f1_test_id - macro_f1_test_ood
    retention_rate: rr = macro_f1_test_ood / macro_f1_test_id * 100
stage: Stage 0
exp_id: EXP-01
research_question: 'Primary baseline: in-domain and OOD performance under raw staining.'
comparator: anchor
_base_source_: configs/base_config.yaml
_overrides_:
  stage: Stage 0
  model:
    backbone: resnet50
  normalization:
    name: none
  augmentation:
    policy: none
